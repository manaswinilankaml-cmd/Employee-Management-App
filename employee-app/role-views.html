<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Management System — Role Views</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { sans: ['system-ui', '-apple-system', 'sans-serif'], mono: ['SF Mono', 'Fira Code', 'monospace'] },
    }
  }
}
</script>
<style>
  * { box-sizing: border-box; }
  body { background: #0f172a; color: #e2e8f0; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; }
  .card:hover { border-color: #475569; }
  .section-title { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #64748b; }
  .crud-badge { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 3px; display: inline-block; margin: 0 1px; font-family: monospace; }
  .c-yes { background: #16a34a20; color: #4ade80; border: 1px solid #16a34a40; }
  .r-yes { background: #2563eb20; color: #60a5fa; border: 1px solid #2563eb40; }
  .u-yes { background: #d9770620; color: #fbbf24; border: 1px solid #d9770640; }
  .d-yes { background: #dc262620; color: #f87171; border: 1px solid #dc262640; }
  .c-no, .r-no, .u-no, .d-no { background: #1e293b; color: #475569; border: 1px solid #334155; }
  .endpoint-chip { font-size: 10px; padding: 2px 6px; border-radius: 3px; font-family: monospace; display: inline-block; margin: 2px 2px; }
  .ep-get { background: #16a34a15; color: #4ade80; }
  .ep-post { background: #2563eb15; color: #60a5fa; }
  .ep-put { background: #d9770615; color: #fbbf24; }
  .ep-delete { background: #dc262615; color: #f87171; }
  .role-tab { cursor: pointer; padding: 10px 20px; font-size: 13px; font-weight: 600; border-bottom: 2px solid transparent; transition: all 0.15s; }
  .role-tab:hover { background: #1e293b80; }
  .role-tab.active { border-bottom-color: #3b82f6; color: #3b82f6; background: #1e293b; }
  .scope-full { color: #4ade80; }
  .scope-dept { color: #fbbf24; }
  .scope-team { color: #c084fc; }
  .scope-self { color: #60a5fa; }
  .scope-none { color: #475569; }
  .action-row { border-bottom: 1px solid #334155; }
  .action-row:last-child { border-bottom: none; }
  .stat-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; text-align: center; }
  .stat-number { font-size: 28px; font-weight: 800; }
  .resource-section { border-left: 3px solid; padding-left: 16px; margin-bottom: 16px; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeIn 0.2s ease-out; }
  .scrollbar-thin::-webkit-scrollbar { width: 5px; }
  .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
</style>
</head>
<body class="min-h-screen">

<!-- Header -->
<header class="border-b border-gray-800 px-6 py-4">
  <div class="max-w-[1300px] mx-auto">
    <h1 class="text-lg font-bold text-gray-200">Post-Login Role Views</h1>
    <p class="text-xs text-gray-400 mt-0.5">What each role sees after logging in — data scope, allowed actions, and API endpoints</p>
  </div>
</header>

<!-- Role Tabs -->
<nav class="border-b border-gray-800 px-6">
  <div class="max-w-[1300px] mx-auto flex">
    <div class="role-tab active" onclick="showRole('admin')" data-role="admin">HR_ADMIN / IT_ADMIN</div>
    <div class="role-tab" onclick="showRole('depthead')" data-role="depthead">DEPT_HEAD</div>
    <div class="role-tab" onclick="showRole('manager')" data-role="manager">MANAGER</div>
    <div class="role-tab" onclick="showRole('employee')" data-role="employee">EMPLOYEE</div>
  </div>
</nav>

<main class="max-w-[1300px] mx-auto p-6" id="content"></main>

          { verb: "Assign manager", method: "PUT", endpoint: "/employees/{id}/manager", desc: "Set reporting relationship" },

        scope: "No access",

        actions: []
      },
      {
        name: "Permissions",
        borderColor: "#2dd4bf",
        crud: [0,0,0,0],
        scope: "No access",

      },
    ]
  },
  manager: {
    title: "MANAGER",
    subtitle: "Can read their direct reportees, projects, departments, and roles. No create/update/delete.",
    color: "#60a5fa",
    scope: "TEAM — Should see only their direct reportees.",
    stats: [
      { label: "My Reportees", icon: "👥", example: "6", color: "#4ade80" },
      { label: "Projects", icon: "📋", example: "8", color: "#c084fc" },
      { label: "Departments", icon: "🏢", example: "5", color: "#60a5fa" },
    ],
    resources: [
      {
        name: "Employees",
        borderColor: "#4ade80",
        crud: [0,1,0,0],
        scope: "Own reportees only (NOT YET IMPLEMENTED — currently shows all)",
        scopeClass: "scope-team",
        actions: [
          { verb: "View my reportees", method: "GET", endpoint: "/employees", desc: "⚠ Currently returns ALL — should filter to reportees" },
          { verb: "View one employee", method: "GET", endpoint: "/employees/{emp_id}", desc: "Detail view with skills" },
          { verb: "View reportees list", method: "GET", endpoint: "/employees/{my_id}/reportees", desc: "Direct reports" },
        ]
      },
      {
        name: "Projects",
        borderColor: "#c084fc",
        crud: [0,1,0,0],
        scope: "All projects (read only)",
        scopeClass: "scope-full",
        actions: [
          { verb: "View all projects", method: "GET", endpoint: "/projects", desc: "Read-only list" },
          { verb: "View project members", method: "GET", endpoint: "/projects/{id}/members", desc: "Read-only member list" },
        ]
      },
      {

        borderColor: "#60a5fa",

        crud: [0,1,0,0],

        scopeClass: "scope-full",
        actions: [
          { verb: "View all roles", method: "GET", endpoint: "/roles", desc: "Read-only list" },
        ]

        name: "Accounts",
        borderColor: "#fbbf24",
        crud: [0,0,0,0],
        scope: "No access",
        scopeClass: "scope-none",
        actions: []
      },
      {
        name: "Permissions",
        borderColor: "#2dd4bf",
        crud: [0,0,0,0],
        scope: "No access",
        scopeClass: "scope-none",
        actions: []
      },
    ]
  },

    title: "EMPLOYEE",

      { label: "Departments", icon: "🏢", example: "5", color: "#60a5fa" },
    ],
    resources: [
      {
        name: "Employees",
        borderColor: "#4ade80",

function showRole(roleKey) {
  document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`[data-role="${roleKey}"]`).classList.add('active');
  renderRole(roleKey);
}

function crudBadges(crud) {
  const labels = ['C','R','U','D'];
  const classes = ['c','r','u','d'];
  return crud.map((v, i) => `<span class="crud-badge ${classes[i]}-${v ? 'yes' : 'no'}">${labels[i]}</span>`).join('');
}

function methodClass(m) {
  return m === 'GET' ? 'ep-get' : m === 'POST' ? 'ep-post' : m === 'PUT' ? 'ep-put' : 'ep-delete';
}

function renderRole(roleKey) {
  const role = ROLES[roleKey];
  const el = document.getElementById('content');

  let html = `<div class="fade-in">`;

  // Header
  html += `<div class="mb-6">`;
  html += `<h2 class="text-xl font-bold" style="color:${role.color}">${role.title}</h2>`;
  html += `<p class="text-sm text-gray-400 mt-1">${role.subtitle}</p>`;
  html += `<div class="mt-2 text-xs px-3 py-1.5 rounded inline-block" style="background:${role.color}15; color:${role.color}; border: 1px solid ${role.color}30">`;
  html += `Data Scope: ${role.scope}</div>`;
  html += `</div>`;

  // Stats
  html += `<div class="grid grid-cols-3 md:grid-cols-6 gap-3 mb-6">`;
  role.stats.forEach(s => {
    html += `<div class="stat-card">`;
    html += `<div class="text-lg mb-1">${s.icon}</div>`;
    html += `<div class="stat-number" style="color:${s.color}">${s.example}</div>`;
    html += `<div class="text-[10px] text-gray-400 mt-1">${s.label}</div>`;
    html += `</div>`;
  });
  html += `</div>`;

  // Resources
  role.resources.forEach(res => {
    html += `<div class="resource-section mb-4" style="border-left-color:${res.borderColor}">`;
    html += `<div class="flex items-center justify-between mb-2">`;
    html += `<div class="flex items-center gap-3">`;
    html += `<span class="text-sm font-bold" style="color:${res.borderColor}">${res.name}</span>`;
    html += `<span>${crudBadges(res.crud)}</span>`;
    html += `</div>`;
    html += `<span class="text-[10px] ${res.scopeClass}">${res.scope}</span>`;
    html += `</div>`;

    if (res.actions.length === 0) {
      html += `<div class="card p-3 text-xs text-gray-500">No access to this resource.</div>`;
    } else {
      html += `<div class="card overflow-hidden">`;
      res.actions.forEach(a => {
        const isWarning = a.desc.startsWith('⚠');
        html += `<div class="action-row flex items-start gap-3 px-3 py-2 text-xs ${isWarning ? 'bg-amber-900/10' : ''}">`;
        html += `<span class="endpoint-chip ${methodClass(a.method)} shrink-0 mt-0.5">${a.method}</span>`;
        html += `<div class="flex-1 min-w-0">`;
        html += `<div class="font-medium text-gray-200">${a.verb}</div>`;
        html += `<div class="text-gray-500 font-mono text-[10px] truncate">${a.endpoint}</div>`;
        html += `</div>`;
        html += `<div class="text-gray-400 text-right text-[10px] max-w-[280px]">${a.desc}</div>`;
        html += `</div>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  });

  // Legend at bottom
  html += `<div class="card p-3 mt-4 flex flex-wrap gap-4 text-[10px]">`;
  html += `<span class="text-gray-500 font-bold mr-2">DATA SCOPE LEGEND:</span>`;
  html += `<span class="scope-full">● FULL — All rows</span>`;
  html += `<span class="scope-dept">● DEPT — Own department</span>`;
  html += `<span class="scope-team">● TEAM — Own reportees</span>`;
  html += `<span class="scope-self">● SELF — Own profile only</span>`;
  html += `<span class="scope-none">● NONE — Blocked</span>`;
  html += `<span class="text-amber-400 ml-4">⚠ = Not yet implemented (currently returns all data)</span>`;
  html += `</div>`;

  html += `</div>`;
  el.innerHTML = html;
}

// Init
renderRole('admin');
</script>
</body>
</html>
